  <!-- ================= 3. Starlight Accents on Wordmark ================= -->
  <!-- Morning Star Accent over final 'e' -->
  <g transform="translate(424, 52) scale(0.72)" filter="url(#starGlow)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFFFFF" />
    <circle cx="0" cy="0" r="2.5" fill="url(#stamenGoldCore)" />
    <circle cx="0" cy="0" r="1.0" fill="#FFFFFF" />
  </g>

  <!-- Subtle Micro-Glint over 'p' ascender crest -->
  <circle cx="248" cy="48" r="1.4" fill="#FFFFFF" opacity="0.85" />
</svg>