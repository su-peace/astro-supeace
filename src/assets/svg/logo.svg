<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 153" fill="none">
  <defs>
    <!-- ================= Azure & Lily Color Architecture ================= -->
    <!-- Sky Azure to Midnight Navy Vertical Gradient for Wordmark -->
    <linearGradient id="azureWordmarkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7BB0F2" />
      <stop offset="25%" stop-color="#558DD8" />
      <stop offset="65%" stop-color="#32599C" />
      <stop offset="100%" stop-color="#14244F" />
    </linearGradient>

    <!-- Deep Azure Petal Base -->
    <linearGradient id="azurePetalDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1350" />
      <stop offset="40%" stop-color="#1E3875" />
      <stop offset="80%" stop-color="#4E81C7" />
      <stop offset="100%" stop-color="#6B9DE3" />
    </linearGradient>

    <!-- Wing Petal Midtone Gradient -->
    <linearGradient id="azurePetalMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2D5E" />
      <stop offset="50%" stop-color="#4E81C7" />
      <stop offset="100%" stop-color="#76A9E8" />
    </linearGradient>

    <!-- Sky Breeze / Contrail Cyan Arc Gradient -->
    <linearGradient id="skyBreezeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E81C7" />
      <stop offset="60%" stop-color="#76A9E8" />
      <stop offset="100%" stop-color="#B2D8FC" />
    </linearGradient>

    <!-- Luminous Lily Petal & Frost Glaze -->
    <linearGradient id="lilyWhitePetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F2F7FD" />
      <stop offset="100%" stop-color="#D7E6F8" />
    </linearGradient>

    <!-- 8-Point Starlight Diamond Gradient -->
    <linearGradient id="starlightDiamond" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2EEFC" />
      <stop offset="100%" stop-color="#83B4F1" />
    </linearGradient>

    <!-- Golden Stamen Core (Anime Lily Pistil Glow) -->
    <radialGradient id="stamenGoldCore" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFBF0" />
      <stop offset="40%" stop-color="#F7D88C" />
      <stop offset="85%" stop-color="#D9A343" />
      <stop offset="100%" stop-color="#B27E25" />
    </radialGradient>

    <!-- Refined Ambient Drop Shadow (Ensures high contrast on pure white) -->
    <filter id="naturalShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1350" flood-opacity="0.30" />
    </filter>

    <!-- Core Starlight Luminescence Filter -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FFFFFF" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="3.5" flood-color="#4E81C7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ================= 1. The Emblem: Lily of Peace & Celestial Star ================= -->
  <g id="brand-emblem" transform="translate(68, 76.5) scale(0.88) translate(-75, -75)">
    <!-- Atmospheric Breeze Arc (Echoes the sky contrail from the key art) -->
    <path d="M 22 96 A 56 56 0 0 1 128 38" stroke="url(#skyBreezeGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 128 78 A 56 56 0 0 1 34 114" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.55" />
    <circle cx="128" cy="38" r="2.5" fill="#FFFFFF" />
    <circle cx="26" cy="102" r="2.0" fill="#76A9E8" />

    <!-- Ambient Outer Depth Petals (Navy/Azure Base) -->
    <g filter="url(#naturalShadow)">
      <!-- Center Upright Petal Base -->
      <path d="M 75 125 C 63 98 60 62 65 35 C 68 21 75 10 75 10 C 75 10 82 21 85 35 C 90 62 87 98 75 125 Z" 
            fill="url(#azurePetalDeep)" />
      <!-- Left Sweeping Wing Petal Base -->
      <path d="M 73 123 C 48 117 26 95 20 72 C 14 53 17 41 22 39 C 26 37 38 45 50 61 C 62 77 70 95 73 123 Z" 
            fill="url(#azurePetalMid)" />
      <!-- Right Sweeping Wing Petal Base -->
      <path d="M 77 123 C 102 117 124 95 130 72 C 136 53 133 41 128 39 C 124 37 112 45 100 61 C 88 77 80 95 77 123 Z" 
            fill="url(#azurePetalMid)" />
    </g>

    <!-- Inner Luminous Lily Petals (Crisp White with Frost Glaze) -->
    <!-- Center Upright Petal -->
    <path d="M 75 121 C 65 96 64 64 67 39 C 69 25 75 17 75 17 C 75 17 81 25 83 39 C 86 64 85 96 75 121 Z" 
          fill="url(#lilyWhitePetal)" stroke="#FFFFFF" stroke-width="1.2" />
    <path d="M 75 117 L 75 28" stroke="url(#skyBreezeGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />

    <!-- Left Wing Petal -->
    <path d="M 73 119 C 50 113 30 91 24 70 C 19 54 21 45 25 43 C 29 41 40 49 52 65 C 63 79 70 95 73 119 Z" 
          fill="url(#lilyWhitePetal)" stroke="#FFFFFF" stroke-width="1.4" />
    <path d="M 28 51 C 40 67 56 85 72 109" stroke="#4E81C7" stroke-width="1.4" stroke-linecap="round" opacity="0.45" fill="none" />

    <!-- Right Wing Petal -->
    <path d="M 77 119 C 100 113 120 91 126 70 C 131 54 129 45 125 43 C 121 41 110 49 98 65 C 87 79 80 95 77 119 Z" 
          fill="url(#lilyWhitePetal)" stroke="#FFFFFF" stroke-width="1.4" />
    <path d="M 122 51 C 110 67 94 85 78 109" stroke="#4E81C7" stroke-width="1.4" stroke-linecap="round" opacity="0.45" fill="none" />

    <!-- Calyx Base Accents -->
    <path d="M 73 122 C 55 127 40 121 32 107 C 30 104 35 102 42 104 C 52 108 64 114 73 122 Z" 
          fill="url(#azurePetalMid)" opacity="0.95" />
    <path d="M 77 122 C 95 127 110 121 118 107 C 120 104 115 102 108 104 C 98 108 86 114 77 122 Z" 
          fill="url(#azurePetalMid)" opacity="0.95" />

    <!-- 8-Point Starlight / Snowflake Crystal Core -->
    <g filter="url(#starGlow)">
      <!-- 4 Faceted Diamond Rays -->
      <polygon points="75,38 79,73 112,76.5 79,80 75,115 71,80 38,76.5 71,73" 
               fill="url(#starlightDiamond)" stroke="#FFFFFF" stroke-width="1.2" />
      <!-- 4 Secondary Diagonal Rays -->
      <polygon points="75,61 77.5,74.5 89,64 76.5,77.5 87,88 75,78.5 63,88 73.5,77.5 61,64 74.5,74.5" 
               fill="#FFFFFF" />
      <!-- Golden Stamen Core (Morning sun warmth) -->
      <circle cx="75" cy="76.5" r="5.2" fill="url(#stamenGoldCore)" />
      <circle cx="75" cy="76.5" r="2.2" fill="#FFFFFF" />
    </g>

    <!-- Drifting Petal Catching the Breeze -->
    <g transform="translate(122, 17) rotate(-16) scale(0.85)" filter="url(#naturalShadow)">
      <path d="M 14 -2 C 26 -5 36 1 38 10 C 39 19 28 23 20 19 C 11 15 7 4 14 -2 Z" 
            fill="url(#lilyWhitePetal)" stroke="#FFFFFF" stroke-width="1.4" />
      <path d="M 16 2 Q 25 10 30 16" stroke="#76A9E8" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.65" />
    </g>
    <!-- Breeze Spores / Micro Sparkles connecting Emblem to Text -->
    <circle cx="146" cy="11" r="1.8" fill="#FFFFFF" />
    <circle cx="152" cy="18" r="1.2" fill="#76A9E8" />
  </g>

